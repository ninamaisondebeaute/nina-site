<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci pour votre commande — Nina Maison de Beauté</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Playfair+Display:ital,wght@0,600;0,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5EEE2; --paper:#FBF7EF; --ink:#211C15; --ink-soft:#5B4E3C;
    --tan-deep:#9C7C4B; --line:rgba(33,28,21,0.15);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--cream); color:var(--ink); font-family:'Inter',sans-serif; padding:24px;
  }
  .card{
    max-width:480px; width:100%; background:var(--paper); border:1px solid var(--line);
    padding:48px 40px; text-align:center;
  }
  .brand-box{border:1px solid var(--ink); display:inline-flex; flex-direction:column; align-items:center; padding:6px 14px 7px; margin-bottom:28px;}
  .brand-box .n1{font-family:'Parisienne',cursive; font-size:22px;}
  .brand-box .n2{font-family:'Inter',sans-serif; font-size:8px; letter-spacing:0.22em; text-transform:uppercase; margin-top:2px;}
  .check{width:56px; height:56px; margin:0 auto 22px; border-radius:50%; background:#EFE7D6; display:flex; align-items:center; justify-content:center;}
  h1{font-family:'Playfair Display',serif; font-size:26px; text-transform:uppercase; margin:0;}
  p{font-size:14.5px; color:var(--ink-soft); margin-top:16px; line-height:1.6;}
  a.btn{
    display:inline-block; margin-top:28px; padding:14px 26px; background:var(--tan-deep); color:var(--paper);
    text-decoration:none; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand-box"><span class="n1">Nina</span><span class="n2">Maison de Beauté</span></div>
    <div class="check">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9C7C4B" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1>Merci pour votre commande</h1>
    <p>Votre paiement a bien été enregistré. Vous recevrez un e-mail de confirmation de Stripe, et nous revenons vers vous rapidement pour organiser le retrait en institut ou l'envoi de votre commande.</p>
    <a class="btn" href="/">Retour au site</a>
  </div>
</body>
</html>
